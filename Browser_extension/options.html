<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KeyVault</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="icons/icon.png" alt="" width="30" height="30">
      <div>
        <div class="brand-name">KeyVault</div>
        <div class="brand-sub">独立浏览器保管箱</div>
      </div>
    </div>
    <nav id="nav">
      <button data-tab="dashboard" class="active">仪表盘</button>
      <button data-tab="secrets">密钥管理</button>
      <button data-tab="audit">审计日志</button>
      <button data-tab="tools">备份 / 导入</button>
      <button data-tab="settings">设置</button>
    </nav>
    <div class="sidebar-foot">
      <span id="foot-dot" class="dot"></span>
      <span id="foot-text">…</span>
      <button id="lock-btn" class="ghost hidden">锁定</button>
    </div>
  </aside>

  <main id="main">
    <div id="gate" class="gate hidden">
      <div class="card gate-card">
        <h2 id="gate-title"></h2>
        <p id="gate-desc" class="muted"></p>
        <input id="gate-password" type="password" placeholder="主密码（至少 8 位）">
        <div id="gate-error" class="error"></div>
        <button id="gate-submit" class="primary"></button>
      </div>
    </div>

    <section id="tab-dashboard" class="tab hidden">
      <div class="stat-row" id="stat-cards"></div>
      <div class="card">
        <h3>平台分布</h3>
        <ul id="platform-list" class="platform-list"></ul>
      </div>
    </section>

    <section id="tab-secrets" class="tab hidden">
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索名称 / 平台 / 备注">
        <select id="status-filter">
          <option value="">全部状态</option>
          <option value="active">启用</option>
          <option value="revoked">已吊销</option>
          <option value="expired">已过期</option>
        </select>
        <button id="add-btn" class="primary">添加</button>
        <button id="import-btn">批量导入</button>
      </div>
      <div class="card table-card">
        <table id="table">
          <thead>
            <tr><th>名称</th><th>平台</th><th>状态</th><th>预览</th><th>更新时间</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="table-empty" class="empty hidden"></div>
      </div>
    </section>

    <section id="tab-audit" class="tab hidden">
      <div class="toolbar">
        <span id="chain-state" class="muted"></span>
        <button id="audit-refresh">刷新</button>
      </div>
      <div class="card table-card">
        <table>
          <thead><tr><th>时间</th><th>事件</th><th>操作者</th><th>记录</th></tr></thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-tools" class="tab hidden">
      <div class="card">
        <h3>批量导入（.env / JSON / curl / AWS csv）</h3>
        <textarea id="import-text" rows="8" placeholder="粘贴多行 .env、一段 JSON、curl 命令或 AWS credentials.csv …"></textarea>
        <div class="row">
          <input id="import-tags" placeholder="标签（逗号分隔，可选）">
          <button id="import-submit" class="primary">解析并入库</button>
        </div>
        <div id="import-result" class="muted"></div>
      </div>
      <div class="card">
        <h3>加密备份（口令另设，与主密码无关）</h3>
        <p class="muted">导出为口令加密的 KVBE1 文件；恢复逐条去重合并。</p>
        <div class="row">
          <input id="backup-password" type="password" placeholder="备份口令（至少 8 位）">
          <button id="export-btn" class="primary">导出备份文件</button>
          <input id="restore-file" type="file" accept=".kvb,.txt,.bak">
        </div>
        <div id="backup-result" class="muted"></div>
      </div>
    </section>

    <section id="tab-settings" class="tab hidden">
      <div class="card">
        <h3>安全</h3>
        <label class="field">
          <span>自动锁定（分钟无操作，0 = 不自动锁）</span>
          <input id="set-autolock" type="number" min="0" max="240">
        </label>
      </div>
      <div class="card">
        <h3>捕获</h3>
        <label class="check">
          <input id="set-capture" type="checkbox"> 在网页上检测复制的密钥并提示存入
        </label>
        <label class="field">
          <span>忽略的站点（主机名，每行一个）</span>
          <textarea id="set-ignored" rows="4" placeholder="例如 mail.example.com"></textarea>
        </label>
        <button id="settings-save" class="primary">保存设置</button>
        <span id="settings-saved" class="muted"></span>
      </div>
      <div class="card danger-zone">
        <h3>危险区</h3>
        <button id="wipe-btn">删除浏览器里的全部数据（vault 与设置）</button>
      </div>
    </section>
  </main>

  <dialog id="detail"></dialog>
  <dialog id="form-dialog"></dialog>
  <script type="module" src="options.js"></script>
</body>
</html>
