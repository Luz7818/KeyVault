<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>KeyVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="dot" id="status-dot" aria-hidden="true"></span>
      <span class="brand-name">KeyVault</span>
      <span class="status-text" id="status-text"></span>
    </div>
    <button type="button" class="lock-btn" id="lock-button" hidden>锁定</button>
  </header>

  <main>
    <!-- 态一：未初始化 —— 引导设主密码（≥8 位） -->
    <section id="setup-view" hidden>
      <h1>创建你的密钥库</h1>
      <p class="lede">主密码用于派生加密密钥（至少 8 位），数据加密后只保存在这台浏览器，不上传任何服务器。主密码丢失无法找回，请先在管理页了解备份出口。</p>
      <form id="setup-form">
        <label class="field">
          <span class="field-label">主密码</span>
          <input type="password" id="setup-password" autocomplete="new-password" placeholder="至少 8 位">
        </label>
        <label class="field">
          <span class="field-label">再输一次</span>
          <input type="password" id="setup-confirm" autocomplete="new-password" placeholder="重复主密码">
        </label>
        <p class="error" id="setup-error" role="alert" hidden></p>
        <button type="submit" class="primary" id="setup-button">创建密钥库</button>
      </form>
    </section>

    <!-- 态二：已锁 —— 解锁 -->
    <section id="unlock-view" hidden>
      <h1>已锁定</h1>
      <p class="lede">输入主密码解锁。</p>
      <form id="unlock-form">
        <label class="field">
          <span class="field-label">主密码</span>
          <input type="password" id="unlock-password" autocomplete="current-password" placeholder="主密码">
        </label>
        <p class="error" id="unlock-error" role="alert" hidden></p>
        <button type="submit" class="primary" id="unlock-button">解锁</button>
      </form>
    </section>

    <!-- 态三：已解锁 —— 搜索 + 掩码列表 + 点击复制 + 生成器 -->
    <section id="list-view" hidden>
      <input type="search" id="search" placeholder="搜索名称 / 平台 / 备注…" aria-label="搜索密钥" autocomplete="off" spellcheck="false">
      <p class="list-hint">点击行复制明文；约 30 秒后自动覆盖剪贴板（无法排除系统剪贴板历史）。</p>
      <div class="rows" id="list-rows"></div>
      <p class="list-meta" id="list-meta"></p>

      <button type="button" class="gen-open" id="gen-open">生成密码…</button>
      <div class="gen-panel" id="gen-panel" hidden>
        <div class="gen-controls">
          <label class="gen-field">长度 <input type="number" id="gen-length" min="8" max="128" step="1"></label>
          <label class="gen-check"><input type="checkbox" id="gen-lower">小写</label>
          <label class="gen-check"><input type="checkbox" id="gen-upper">大写</label>
          <label class="gen-check"><input type="checkbox" id="gen-digits">数字</label>
          <label class="gen-check"><input type="checkbox" id="gen-symbols">符号</label>
          <label class="gen-check"><input type="checkbox" id="gen-ambiguous">排除易混淆</label>
        </div>
        <p class="gen-output" id="gen-output"></p>
        <p class="gen-strength" id="gen-strength"></p>
        <div class="gen-actions">
          <button type="button" class="ghost" id="gen-generate">重新生成</button>
          <button type="button" class="ghost" id="gen-copy">复制</button>
          <button type="button" class="ghost" id="gen-save">存入库…</button>
        </div>
        <div class="gen-save-form" id="gen-save-form" hidden>
          <label class="field">
            <span class="field-label">名称（可选，留空自动命名）</span>
            <input type="text" id="gen-name" placeholder="如 服务器登录">
          </label>
          <label class="field">
            <span class="field-label">平台（必填，如 github.com）</span>
            <input type="text" id="gen-platform" placeholder="github.com">
          </label>
          <button type="button" class="primary" id="gen-save-confirm">确认存入</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="version"></span>
  </footer>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
